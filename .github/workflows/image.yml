name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Discord Social SDK must not be redistributed: it comes from a private repository, read
      # with a deploy key, and only ends up in the private image.
      - uses: actions/checkout@v4
        with:
          repository: 0xsharkboy/discord-social-sdk-vendored
          path: third_party/discord_social_sdk
          ssh-key: ${{ secrets.SDK_DEPLOY_KEY }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/0xsharkboy/nx-discord-rpc-relay:${{ github.sha }}
            ghcr.io/0xsharkboy/nx-discord-rpc-relay:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

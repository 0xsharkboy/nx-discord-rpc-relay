services:
  relay:
    # The official instance's private image. Self-hosting: set your own tag (docs/self-hosting.md).
    image: ghcr.io/0xsharkboy/nx-discord-rpc-relay:main
    env_file: relay.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # The image runs as uid 1000 (user "ubuntu"). Create ./data owned by that uid before the first
    # start, or set `user: "<uid>:<gid>"` here to match its owner.
    volumes:
      - ./data:/data
    # Shutdown clears presences and may wait for a refresh run.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
